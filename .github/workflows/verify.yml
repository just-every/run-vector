name: Verify
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Verification tier
        type: choice
        options: [full]
        default: full
  push:
    branches: [main, 'cloud/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check generated contract documents
        run: node src/base/contract-docs.mjs check
      - id: reuse
        name: Reuse only a green push of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: bash scripts/ci/verification-reuse.sh
      - id: plan
        name: Read the shared verification plan
        run: node --input-type=module -e 'import { verificationMatrix } from "./scripts/verification-plan.mjs"; console.log("matrix=" + JSON.stringify(verificationMatrix));' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the shared production output
        run: pnpm build
      # rer build scans this output for local settings and the dev layer. Share
      # only the emitted application, never HOME, state, settings or receipts.
      - name: Package production output
        run: tar -czf "$RUNNER_TEMP/vector-build.tgz" dist/server dist/client
      - uses: actions/upload-artifact@v4
        with:
          name: vector-build-${{ github.sha }}
          path: ${{ runner.temp }}/vector-build.tgz
          retention-days: 1
          if-no-files-found: error

  shards:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TZ: UTC
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      VITEST_MAX_WORKERS: '1'
      VECTOR_VERIFY_PREBUILT_SHA: ${{ matrix.prebuilt && github.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Reserve disk for native runtime journeys
        if: matrix.native
        run: |
          free_kib() { df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }'; }
          for unused_tools in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; do
            if [ "$(free_kib)" -ge "$((20 * 1024 * 1024))" ]; then break; fi
            sudo rm -rf -- "$unused_tools"
          done
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: vector-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: matrix.browser
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          if ! pnpm exec node scripts/chromium-probe.mjs; then
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            pnpm exec node scripts/chromium-probe.mjs
          fi
      - uses: actions/download-artifact@v4
        if: matrix.prebuilt
        with:
          name: vector-build-${{ github.sha }}
          path: ${{ runner.temp }}/vector-build
      - name: Restore this run's production output
        if: matrix.prebuilt
        run: tar -xzf "$RUNNER_TEMP/vector-build/vector-build.tgz"
      - name: Verify the independent shard
        run: pnpm verify:ci --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-verification-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            evidence/installer/proof.json
            evidence/installer/*.png
            evidence/access/proof.json
            evidence/mutation-refresh/proof.json
            .artifacts/verification/ui-runtime-failure.png
            .artifacts/verification/ui-runtime-failure-safe.json
            .artifacts/verification/issue-controls/manifest.json
            .artifacts/verification/check-results.json
            .artifacts/verification/shard-*.json
            .artifacts/verification/dev-runtime-results.json
            .artifacts/verification/dev-runtime-failure-safe.json
            .artifacts/verification/dev-failure.png
            .artifacts/verification/admin-browser/admin-failure-safe.json
            .artifacts/verification/collaboration-browser/collaboration-failure-safe.json
          if-no-files-found: ignore

  # Keep the required check: only a successful reuse plan can bypass the wall.
  verify:
    needs: [plan, build, shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the complete verification wall
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
