name: Verify
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Verification tier
        type: choice
        options: [full]
        default: full
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: vector-ci-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        name: Read the shared verification plan
        run: node --input-type=module -e 'import { verificationMatrix } from "./scripts/verification-plan.mjs"; console.log("matrix=" + JSON.stringify(verificationMatrix));' >> "$GITHUB_OUTPUT"

  shards:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TZ: UTC
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      VITEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Reserve disk for native runtime journeys
        if: matrix.native
        run: |
          free_kib() { df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }'; }
          for unused_tools in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; do
            if [ "$(free_kib)" -ge "$((20 * 1024 * 1024))" ]; then break; fi
            sudo rm -rf -- "$unused_tools"
          done
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: vector-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Hosted Ubuntu already supplies Chromium runtime libraries. Installing
      # optional fonts/upgrades from its apt mirror can consume the shard cap;
      # the real browser journeys below still validate every runtime dependency.
      - run: pnpm exec playwright install chromium
        if: matrix.browser
      - name: Verify the independent shard
        run: pnpm verify:ci --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-verification-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            evidence/installer/proof.json
            evidence/installer/*.png
            evidence/access/proof.json
            evidence/mutation-refresh/proof.json
            .artifacts/verification/ui-runtime-failure.png
            .artifacts/verification/ui-runtime-failure-safe.json
            .artifacts/verification/issue-controls/manifest.json
            .artifacts/verification/check-results.json
            .artifacts/verification/shard-*.json
            .artifacts/verification/dev-runtime-results.json
            .artifacts/verification/dev-runtime-failure-safe.json
            .artifacts/verification/dev-failure.png
            .artifacts/verification/admin-browser/admin-failure-safe.json
            .artifacts/verification/collaboration-browser/collaboration-failure-safe.json
          if-no-files-found: ignore

  # Keep the existing required check: skipped, cancelled or failed shards fail it.
  verify:
    needs: [plan, shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the complete verification wall
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: test "$PLAN_RESULT" = success && test "$SHARDS_RESULT" = success
