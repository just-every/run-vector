name: Vector verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: vector-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      PLAYWRIGHT_SKIP_BROWSER_GC: 1
      VITEST_MAX_WORKERS: 1
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Reclaim unused runner SDKs for native disk guard
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Actual shared local setup and existing development hydration
        run: pnpm test:dev:ci
      - name: Native installer with startup exceeding two minutes
        run: pnpm test:installer:slow
        env:
          VECTOR_INSTALLER_EVIDENCE: evidence/installer/slow
      - name: README literal clone and independent frozen installation
        run: pnpm test:readme
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-local-verification
          path: |
            evidence/installer/proof.json
            evidence/installer/*.png
            evidence/installer/slow/proof.json
            evidence/installer/slow/*.png
            evidence/access/proof.json
            evidence/mutation-refresh/proof.json
            evidence/readme/proof.json
            evidence/readme/*.png
            .artifacts/verification/ui-runtime-failure.png
            .artifacts/verification/ui-runtime-failure-safe.json
            .artifacts/verification/issue-controls/manifest.json
            .artifacts/verification/check-results.json
            .artifacts/verification/dev-runtime-results.json
            .artifacts/verification/dev-runtime-failure-safe.json
            .artifacts/verification/dev-failure.png
            .artifacts/verification/admin-browser/admin-failure-safe.json
            .artifacts/verification/collaboration-browser/collaboration-failure-safe.json
          if-no-files-found: ignore
